name: HSW365 SMS Outreach to Business Owners

# PAUSED (Oct 13 2026): the daily schedule is off.
# This bot cold-texts scraped business numbers from the same SignalWire number (+1 856-594-3303)
# that is being registered on the "CallTwin Job Alerts" 10DLC campaign. Carriers treat unsolicited
# marketing texts on a job-alerts campaign as a violation and can reject or suspend the campaign and
# block the number. Keep it off until a separate marketing campaign with proper opt-in is approved.
# It can still be run by hand from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch: {}

jobs:
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SMS outreach
        env:
          CALLTWIN_API_URL: ${{ secrets.CALLTWIN_API_URL }}
          CALLTWIN_USER_TOKEN: ${{ secrets.CALLTWIN_USER_TOKEN }}
          SMS_MAX_PER_RUN: "15"
        run: python hsw365_sms_outreach.py

      - name: Commit outreach log
        run: |
          git config user.name "hsw365-sms-outreach-bot"
          git config user.email "hsw365media@gmail.com"
          git add -A
          git diff --quiet --cached || git commit -m "SMS outreach run: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
