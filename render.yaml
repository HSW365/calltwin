# CallTwin production deployment for Render
services:
  - type: web
    name: calltwin-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CALLTWIN_STARTER_PRICE_ID
        sync: false
      - key: CALLTWIN_GROWTH_PRICE_ID
        sync: false
      - key: CALLTWIN_SCALE_PRICE_ID
        sync: false
      - key: CALLTWIN_PRICE_ID
        sync: false
      - key: CALLTWIN_SETUP_PRICE_ID
        sync: false
      - key: LIFETIME_PRICE_ID
        sync: false
      - key: SIGNALWIRE_SPACE
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_API_TOKEN
        sync: false
      - key: SIGNALWIRE_PHONE_NUMBER
        value: "+18565943303"
      - key: CALLTWIN_OWNER_EMAIL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # HSW365 AI Estimate add-on
      - key: OPENAI_API_KEY
        sync: false
      - key: ESTIMATE_ENC_KEY
        sync: false
      - key: ESTIMATE_ADDON_PRICE_CENTS
        value: "4900"
      - key: ESTIMATE_TRIAL_DAYS
        value: "14"
      - key: SENDGRID_API_KEY
        sync: false
      - key: ESTIMATE_FROM_EMAIL
        sync: false
      # Email job alerts (sent together with the text). See backend/services/mailer.js
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NEWARK_OWNER_EMAIL
        sync: false
