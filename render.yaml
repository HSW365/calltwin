services:
  - type: web
    name: calltwin-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CALLTWIN_ONE_TIME_PRICE_ID
        sync: false
      - key: WEBSITE_ONE_TIME_PRICE_ID
        sync: false
      - key: CALLTWIN_WEBSITE_BUNDLE_PRICE_ID
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PHONE_NUMBER
        sync: false
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FUNNEL_LINK
        sync: false
